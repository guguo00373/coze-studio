{{- if .Values.mysql.enabled -}}
{{- if not .Values.mysql.rootPassword -}}
{{- fail "mysql.rootPassword is required when mysql.enabled=true" -}}
{{- end -}}
{{- end -}}
{{- if .Values.postgresql.enabled -}}
{{- if and (not .Values.postgresql.internal) (not .Values.postgresql.host) -}}
{{- fail "postgresql.host is required when postgresql.enabled=true and postgresql.internal=false" -}}
{{- end -}}
{{- if not .Values.postgresql.port -}}
{{- fail "postgresql.port is required when postgresql.enabled=true" -}}
{{- end -}}
{{- if not .Values.postgresql.user -}}
{{- fail "postgresql.user is required when postgresql.enabled=true" -}}
{{- end -}}
{{- if not .Values.postgresql.database -}}
{{- fail "postgresql.database is required when postgresql.enabled=true" -}}
{{- end -}}
{{- if not .Values.postgresql.password -}}
{{- fail "postgresql.password is required when postgresql.enabled=true" -}}
{{- end -}}
{{- if .Values.postgresql.initJob.enabled -}}
{{- if and (not .Values.postgresql.internal) (not .Values.postgresql.superUser) -}}
{{- fail "postgresql.superUser is required when postgresql.initJob.enabled=true" -}}
{{- end -}}
{{- if and (not .Values.postgresql.internal) (not .Values.postgresql.superPassword) -}}
{{- fail "postgresql.superPassword is required when postgresql.initJob.enabled=true" -}}
{{- end -}}
{{- end -}}
{{- end -}}
{{- if not .Values.minio.accessKey -}}
{{- fail "minio.accessKey is required" -}}
{{- end -}}
{{- if not .Values.minio.secretKey -}}
{{- fail "minio.secretKey is required" -}}
{{- end -}}
